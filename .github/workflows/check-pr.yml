name: "Conventional commit PRs"

# SECURITY NOTE: this workflow runs on `pull_request_target`, so it executes in
# the context of the BASE branch with a token that is available even when the
# pull request comes from a fork.
#
# That is only safe because this workflow:
#   - never checks out or executes PR code (no actions/checkout),
#   - never interpolates PR-controlled data (title, body, branch name) into a
#     `run:` script; the only expression used in one is `needs.main.result`,
#     which is a fixed enum,
#   - grants nothing by default (`permissions: {}` below), so the job that
#     needs the PR title opts in to `pull-requests: read` and nothing else.
#
# DO NOT add a checkout of PR code, or run any PR-provided content, here. Doing
# so would let a fork execute arbitrary code with write access to this
# repository (a "pwn request"). If code from a PR ever needs to be tested, use
# a separate workflow on the plain `pull_request` trigger.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      # Required-check safety: re-run on every push so the check stamps each new
      # head commit, otherwise a required title check gets stuck "Expected".
      - synchronize
  # Merge queue: the workflow must run on merge_group so the required
  # "Conventional commit PRs" check reports on the queue's merge commit.
  merge_group:

# Default-deny; each job opts in to what it needs. The aggregator needs nothing.
permissions: {}

jobs:
  main:
    name: Validate PR title
    # No PR context in a merge_group event, and the title was already validated
    # before the PR entered the queue. Skip here - the aggregator below still
    # reports success (a skipped need is allowed), satisfying the required check.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          # Dependabot picks its own scope: "deps" when the PR touches a runtime
          # dependency, "deps-dev" when every package in it comes from a
          # [dependency-groups] entry. Only uv makes that distinction; cargo and
          # github-actions report everything as "deps".
          scopes: |
            grz-common
            grz-cli
            grzctl
            grz-pydantic-models
            grz-pydantic-models-testing
            grz-db
            grz-tools
            grz-check
            grz-watchdog
            repo
            release
            deps
            deps-dev
            other
          requireScope: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Aggregator job: a single, stable check-run name to use as the required
  # status check in branch protection, independent of the underlying job name.
  conventional-commit-pr:
    name: Conventional commit PRs
    needs: [main]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify PR title validation did not fail
        run: |
          # Fail only on failure/cancelled; a skipped run is allowed.
          result="${{ needs.main.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "PR title validation did not pass: $result"
            exit 1
          fi
