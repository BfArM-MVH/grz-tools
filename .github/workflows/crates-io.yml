name: Publish Rust Crate to Crates.io

on:
  push:
    tags:
      - 'grz-check-v[0-9]+.[0-9]+.[0-9]+*'

env:
  RUST_TOOLCHAIN_VERSION: "1.89.0"

jobs:
  publish-to-crates-io:
    name: Build & Publish grz-check
    runs-on: ubuntu-latest
    if: "startsWith(github.ref_name, 'grz-check')"
    environment:
      name: crates.io
      url: https://crates.io/crates/grz-check
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Publish grz-check to crates.io
        working-directory: packages/grz-check
        # Passed via env rather than on the command line: an argument is visible
        # in the runner's process list, and cargo reads this variable natively.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish